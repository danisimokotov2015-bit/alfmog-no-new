<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>АЛЬФМОГ — твой цифровой мир</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#18263d;--text:#eef4ff;--muted:#9eb0ca;--accent:#6c8cff;--line:#263650;--good:#42c99a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#1c3154 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#0b1220eF;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.7px;font-size:20px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#7395ff,#7358d8);display:grid;place-items:center;box-shadow:0 8px 24px #526ee455}
header small{color:var(--muted);font-weight:500;letter-spacing:0}
.wrap{max-width:1200px;margin:auto;padding:22px 16px 60px}
.hero{padding:26px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(120deg,#1b3152,#18233b 65%,#28244e);margin-bottom:20px}
.hero h1{font-size:clamp(27px,5vw,42px);margin:0 0 8px}.hero p{margin:0;color:#c3d1e8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--text);font:inherit}
button,.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}
button.secondary{background:var(--panel2);border:1px solid var(--line)}button:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:13px}
.tile{border:1px solid var(--line);background:linear-gradient(150deg,var(--panel2),var(--panel));border-radius:18px;padding:17px;min-height:118px;text-align:left;color:var(--text);transition:.18s}
.tile:hover{border-color:#718fff;transform:translateY(-2px)}.tile .ico{font-size:26px}.tile strong{display:block;margin-top:9px;font-size:16px}.tile span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
.panel h2{margin:0 0 12px;font-size:23px}.muted{color:var(--muted)}.hidden{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input,.row select,.panel input,.panel select,.panel textarea{background:#0c1728;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font:inherit;max-width:100%}
.result{padding:12px;border-radius:12px;background:#0c1728;margin-top:12px;line-height:1.55}
.back{background:var(--panel2);border:1px solid var(--line);margin-bottom:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:15px;background:#0c1728;border:1px solid var(--line);border-radius:14px}.stat b{font-size:23px;display:block}
.board{display:grid;gap:5px;max-width:360px;margin:14px 0}.cell{aspect-ratio:1;background:#243653;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:20px;cursor:pointer;user-select:none}.cell.open{background:#dbe7fa;color:#16233a}.cell.flag{background:#594b7b}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px}
a{color:#9db4ff}
@media(max-width:520px){header{padding:11px 13px}.hero{padding:20px}.wrap{padding:16px 12px 40px}.tile{min-height:105px;padding:14px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">А</div><div>АЛЬФМОГ<br><small>Твой цифровой мир</small></div></div><button class="secondary" onclick="toggleTheme()">☀️ / 🌙</button></header>
<main class="wrap">
<section id="home">
 <div class="hero"><h1>Добро пожаловать в АЛЬФМОГ</h1><p>Играй, учись, узнавай новое и следи за тем, что происходит в мире.</p></div>
 <div class="toolbar"><input class="search" id="search" placeholder="Поиск раздела..." oninput="filterTiles()"><button class="secondary" onclick="showHome()">Главная</button></div>
 <div class="grid" id="tiles"></div>
</section>
<section id="page" class="hidden">
 <button class="back" onclick="showHome()">← Все разделы</button>
 <div class="panel"><h2 id="pageTitle"></h2><div id="pageContent"></div></div>
</section>
<footer>АЛЬФМОГ · Учись, играй, открывай новое</footer>
</main>
<script>
const sections=[
["🌍","Энциклопедия стран","Страны и интересные факты","countries"],
["🧩","Судоку","Логическая головоломка","sudoku"],
["💣","Сапёр","Найди безопасные клетки","mines"],
["🛰️","Космическая станция","Космос и планеты","space"],
["📰","Мировые события","Новости и события мира","events"],
["💰","Финансы","Валюта и финансовая грамотность","finance"],
["📷","Камеры мира","Веб-камеры разных мест","cams"],
["🎓","Образование","Полезные учебные материалы","education"],
["🐍","Змейка","Классическая игра","snake"],
["♟️","Шашки","Настольная игра","checkers"],
["🏳️","Угадай флаг","Проверь знания флагов","flags"],
["🔢","2048","Соединяй одинаковые числа","2048"],
["⭕","Крестики-нолики","Играй против компьютера","ttt"],
["🍬","Три в ряд","Собирай одинаковые элементы","match3"],
["🕒","Часы городов","Время в разных городах","clocks"],
["🌦️","Погода","Погодная информация","weather"],
["🌅","Рассвет и закат","Солнечный день","sun"],
["🗓️","Календарь","Даты и планы","calendar"],
["📊","Статистика","Твоя активность","stats"],
["🌐","Переводчик","Перевод текста","translator"],
["🗺️","Карты","Открыть карту мира","maps"],
["🚦","Пробки","Дорожная обстановка","traffic"],
["🛡️","Безопасность","Полезные правила безопасности","safety"],
["🌧️","Карта осадков","Осадки на карте","rain"],
["🏳️","Атлас флагов","Флаги стран мира","atlas"],
["⏰","Тренировки и напоминания","План занятий и дела","training"]
];
const $=id=>document.getElementById(id);
function renderTiles(list=sections){$("tiles").innerHTML=list.map(s=>`<button class="tile" onclick="openSection('${s[3]}')"><div class="ico">${s[0]}</div><strong>${s[1]}</strong><span>${s[2]}</span></button>`).join("")}
function filterTiles(){let q=$("search").value.toLowerCase();renderTiles(sections.filter(s=>s.join(" ").toLowerCase().includes(q)))}
function showHome(){$("home").classList.remove("hidden");$("page").classList.add("hidden")}
function showPage(title,html){$("home").classList.add("hidden");$("page").classList.remove("hidden");$("pageTitle").textContent=title;$("pageContent").innerHTML=html;window.scrollTo(0,0)}
function openSection(id){
const s=sections.find(x=>x[3]===id);let title=s[1],html="";
switch(id){
case"countries":html=`<p class="muted">Небольшая энциклопедия стран. Выбери страну:</p><div class="cards">${countryData.map(c=>`<button class="tile" onclick="countryInfo('${c[0]}')"><strong>${c[1]} ${c[0]}</strong><span>${c[2]}</span></button>`).join("")}</div><div id="countryInfo" class="result">Нажми на страну, чтобы увидеть информацию.</div>`;break;
case"flags":html=`<p>Угадай страну по флагу:</p><div id="flagGame" class="result"></div><button onclick="nextFlag()">Следующий вопрос</button>`;break;
case"atlas":html=`<p>Атлас флагов стран:</p><div class="cards">${countryData.map(c=>`<div class="stat"><b>${c[1]} ${c[0]}</b><span>${c[2]}</span></div>`).join("")}</div>`;break;
case"clocks":html=`<p class="muted">Часовые пояса</p><div class="cards" id="clocks"></div>`;setTimeout(updateClocks,30);break;
case"calendar":html=`<p>Сегодня: <b>${new Date().toLocaleDateString("ru-RU",{dateStyle:"full"})}</b></p><input type="date" id="calDate"><input id="calNote" placeholder="Название события"><button onclick="addEvent()">Добавить</button><div id="events" class="result">События можно записывать в этом списке на время открытой страницы.</div>`;break;
case"stats":html=`<div class="cards"><div class="stat"><b id="visits">${visits}</b>Открытий разделов</div><div class="stat"><b>${sections.length}</b>Разделов в АЛЬФМОГ</div></div><p class="muted">Статистика хранится только в этом браузере, если включено локальное хранилище.</p>`;break;
case"finance":html=`<h3>Калькулятор валют</h3><p class="muted">Пример расчёта — не текущий биржевой курс.</p><div class="row"><input type="number" id="money" value="100"><select id="rate"><option value="1">Условные единицы</option><option value="0.9">Евро (пример)</option><option value="0.011">Доллары (пример)</option></select><button onclick="calcMoney()">Посчитать</button></div><div id="moneyResult" class="result"></div><h3>Финансовая грамотность</h3><p>Планируй расходы, сравнивай цены, откладывай часть карманных денег и не сообщай никому пароли или коды из SMS.</p>`;break;
case"translator":html=`<p>Встроенный демонстрационный переводчик. Для настоящего перевода всех языков нужен подключённый онлайн-сервис.</p><textarea id="trText" rows="4" style="width:100%" placeholder="Напиши текст..."></textarea><div class="row"><select id="trLang"><option>Английский</option><option>Русский</option><option>Испанский</option></select><button onclick="translateDemo()">Перевести</button></div><div id="trResult" class="result">Перевод появится здесь.</div>`;break;
case"education":html=`<h3>Учебный уголок</h3><div class="cards"><div class="stat"><b>Математика</b>Повторяй таблицу умножения и решай задачи.</div><div class="stat"><b>Русский язык</b>Практикуй орфографию и пунктуацию.</div><div class="stat"><b>Английский</b>Учись новым словам каждый день.</div><div class="stat"><b>Наука</b>Изучай природу, космос и технологии.</div></div>`;break;
case"space":html=`<h3>Космическая станция</h3><p>Добро пожаловать на виртуальную станцию! Выбери объект:</p><div class="cards">${[["☀️","Солнце","Звезда в центре Солнечной системы."],["🌍","Земля","Наш дом, третья планета от Солнца."],["🔴","Марс","Планета, известная как Красная планета."],["🪐","Сатурн","Газовый гигант с заметными кольцами."],["🌙","Луна","Естественный спутник Земли."]].map(x=>`<button class="tile" onclick="alert('${x[1]}: ${x[2]}')"><strong>${x[0]} ${x[1]}</strong></button>`).join("")}</div>`;break;
case"events":html=`<h3>Мировые события</h3><p>Для актуальной новостной ленты требуется подключить новостной источник. Пока здесь можно открыть новостные сайты:</p><ul><li><a href="https://www.bbc.com/news" target="_blank" rel="noopener">BBC News</a></li><li><a href="https://www.reuters.com/world/" target="_blank" rel="noopener">Reuters — World</a></li></ul>`;break;
case"cams":html=`<h3>Камеры мира</h3><p>Подборка публичных веб-камер (доступность зависит от сайта):</p><ul><li><a href="https://www.skylinewebcams.com/" target="_blank" rel="noopener">Skyline Webcams</a></li><li><a href="https://www.earthcam.com/" target="_blank" rel="noopener">EarthCam</a></li></ul>`;break;
case"maps":html=`<p>Открыть карту:</p><a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap — карта мира</a>`;break;
case"weather":case"rain":case"traffic":html=`<p>Этот раздел подготовлен для подключения актуальных данных.</p><p>Открыть внешнюю карту:</p><a href="${id==="rain"?"https://www.windy.com/":id==="traffic"?"https://www.google.com/maps":"https://www.meteoblue.com/"}" target="_blank" rel="noopener">${id==="rain"?"Карта осадков и погоды":id==="traffic"?"Карты дорожной обстановки":"Погодные карты"}</a><p class="muted">Для отображения данных прямо внутри АЛЬФМОГ потребуется подключить подходящий источник.</p>`;break;
case"sun":html=`<p>Для расчёта рассвета и заката выбери город:</p><select id="sunCity"><option value="Perm">Пермь</option><option value="Moscow">Москва</option><option value="Warsaw">Варшава</option></select><button onclick="sunInfo()">Показать информацию</button><div id="sunResult" class="result">В этом автономном макете точное время не рассчитывается.</div>`;break;
case"safety":html=`<h3>Правила безопасности</h3><ul><li>Не сообщай пароли, коды и личные данные незнакомцам.</li><li>Переходи по ссылкам только если доверяешь источнику.</li><li>На дороге соблюдай сигналы светофора и правила перехода.</li><li>При опасности обратись к взрослому, которому доверяешь, или в экстренную службу.</li></ul>`;break;
case"training":html=`<h3>План занятий</h3><p>Добавь занятие:</p><div class="row"><input type="date" id="trainDate"><input id="trainName" placeholder="Например, английский"><button onclick="addTraining()">Добавить</button></div><div id="trainList" class="result">Пока занятий нет.</div>`;break;
case"ttt":html=`<p>Ты играешь за X, компьютер — за O.</p><div id="tttBoard" class="board" style="grid-template-columns:repeat(3,1fr)"></div><button onclick="startTTT()">Новая игра</button><div id="tttMsg" class="result">Твой ход.</div>`;setTimeout(startTTT,20);break;
case"2048":html=`<p>Соединяй одинаковые числа. Управление: стрелки на клавиатуре или кнопки ниже.</p><div id="b2048" class="board" style="grid-template-columns:repeat(4,1fr)"></div><div class="row"><button onclick="move2048('up')">↑</button><button onclick="move2048('left')">←</button><button onclick="move2048('down')">↓</button><button onclick="move2048('right')">→</button><button class="secondary" onclick="init2048()">Заново</button></div>`;setTimeout(init2048,20);break;
case"mines":html=`<p>Открой клетки, избегая мин. Нажми на клетку, чтобы открыть; двойное нажатие ставит флажок.</p><div id="mineBoard" class="board" style="grid-template-columns:repeat(8,1fr)"></div><button onclick="initMines()">Новая игра</button>`;setTimeout(initMines,20);break;
case"sudoku":html=`<p>Мини-судоку 4×4: заполни пустые клетки цифрами 1–4 так, чтобы они не повторялись в строке и столбце.</p><div id="sudokuBoard" class="board" style="grid-template-columns:repeat(4,1fr)"></div><button onclick="checkSudoku()">Проверить</button><div id="sudokuMsg" class="result"></div>`;setTimeout(initSudoku,20);break;
case"snake":html=`<p>Нажимай стрелки на клавиатуре, чтобы управлять змейкой.</p><canvas id="snakeCanvas" width="320" height="320" style="max-width:100%;background:#0c1728;border-radius:12px"></canvas><div><button onclick="startSnake()">Начать / заново</button></div><p class="muted">На телефоне можно использовать свайпы.</p>`;setTimeout(startSnake,20);break;
case"checkers":html=`<p>Демонстрационная доска для шашек: выбери клетку, затем клетку назначения. Здесь пока нет полного соперника-компьютера.</p><div id="checkersBoard" class="board" style="grid-template-columns:repeat(8,1fr)"></div>`;setTimeout(drawCheckers,20);break;
case"match3":html=`<p>Нажми на две соседние клетки, чтобы поменять их местами. Собирай линии из трёх одинаковых значков.</p><div id="matchBoard" class="board" style="grid-template-columns:repeat(6,1fr)"></div><button onclick="initMatch()">Новая игра</button><div id="matchScore" class="result">Очки: 0</div>`;setTimeout(initMatch,20);break;
default:html=`<p>Раздел «${title}» добавлен в АЛЬФМОГ. Его расширенные функции можно подключить в следующих версиях.</p>`;
}
showPage(title,html);visits++;try{localStorage.setItem("alfmogVisits",visits)}catch(e){}
}
const countryData=[["RU","🇷🇺","Россия"],["PL","🇵🇱","Польша"],["US","🇺🇸","США"],["GB","🇬🇧","Великобритания"],["FR","🇫🇷","Франция"],["DE","🇩🇪","Германия"],["JP","🇯🇵","Япония"],["CN","🇨🇳","Китай"],["BR","🇧🇷","Бразилия"],["CA","🇨🇦","Канада"]];
function countryInfo(code){let c=countryData.find(x=>x[0]===code);$("countryInfo").innerHTML=`<b>${c[1]} ${c[2]}</b><br>Код страны: ${c[0]}<br>Это краткая карточка. Подробная энциклопедия может быть расширена.`}
let flagIndex=0;function nextFlag(){let c=countryData[Math.floor(Math.random()*countryData.length)];$("flagGame").innerHTML=`<div style="font-size:64px">${c[1]}</div><div class="row">${countryData.slice(0,4).map(x=>`<button class="secondary" onclick="flagAnswer('${x[0]}','${c[0]}','${x[2]}')">${x[2]}</button>`).join("")}</div><p id="flagAnswer"></p>`}
function flagAnswer(a,b,n){$("flagAnswer").textContent=a===b?"Правильно! 🎉":"Попробуй ещё раз."}
function updateClocks(){let cities=[["Москва","Europe/Moscow"],["Екатеринбург","Asia/Yekaterinburg"],["Ижевск","Europe/Samara"],["Омск","Asia/Omsk"],["Калининград","Europe/Kaliningrad"]];$("clocks").innerHTML=cities.map(c=>`<div class="stat"><b>${new Intl.DateTimeFormat("ru-RU",{timeZone:c[1],hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date())}</b>${c[0]}</div>`).join("");if($("clocks").isConnected)setTimeout(updateClocks,1000)}
function calcMoney(){let n=Number($("money").value)||0,r=Number($("rate").value);$("moneyResult").textContent="Примерный результат: "+(n*r).toFixed(2)+" (условный расчёт, не актуальный курс)."}
function translateDemo(){$("trResult").textContent="Чтобы переводить текст по-настоящему, к сайту нужно подключить онлайн-переводчик. Текст: "+$("trText").value}
function addEvent(){let d=$("calDate").value,n=$("calNote").value;if(!d||!n)return;let el=document.createElement("div");el.textContent=d+" — "+n;$("events").appendChild(el)}
function addTraining(){let d=$("trainDate").value,n=$("trainName").value;if(!d||!n)return;let el=document.createElement("div");el.textContent="📚 "+d+" — "+n;$("trainList").appendChild(el)}
function sunInfo(){$("sunResult").textContent="Для точного расчёта рассвета и заката в выбранном городе понадобится географический источник данных."}
let visits=0;try{visits=Number(localStorage.getItem("alfmogVisits")||0)}catch(e){}
function toggleTheme(){document.body.classList.toggle("light");if(document.body.classList.contains("light")){document.documentElement.style.setProperty("--bg","#edf2fb");document.documentElement.style.setProperty("--panel","#fff");document.documentElement.style.setProperty("--panel2","#f4f7ff");document.documentElement.style.setProperty("--text","#17233a");document.documentElement.style.setProperty("--muted","#5d6b82");document.documentElement.style.setProperty("--line","#d7dfed")}else{["--bg","--panel","--panel2","--text","--muted","--line"].forEach((x,i)=>document.documentElement.style.removeProperty(x))}}
let ttt=[];function startTTT(){ttt=Array(9).fill("");drawTTT();$("tttMsg").textContent="Твой ход."}
function drawTTT(){$("tttBoard").innerHTML=ttt.map((v,i)=>`<button class="cell" onclick="tttMove(${i})">${v}</button>`).join("")}
function winner(a){for(let l of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])return a[l[0]];return a.every(Boolean)?"draw":""}
function tttMove(i){if(ttt[i]||winner(ttt))return;ttt[i]="X";let w=winner(ttt);if(!w){let free=ttt.map((v,i)=>v?null:i).filter(v=>v!==null);if(free.length){let winMove=free.find(j=>{let a=ttt.slice();a[j]="O";return winner(a)==="O"});let block=free.find(j=>{let a=ttt.slice();a[j]="X";return winner(a)==="X"});ttt[winMove??block??free[Math.floor(Math.random()*free.length)]]="O"}}drawTTT();w=winner(ttt);$("tttMsg").textContent=w==="X"?"Ты победил!":w==="O"?"Компьютер победил.":w==="draw"?"Ничья!":"Твой ход."}
let g2048=[];function init2048(){g2048=Array.from({length:4},()=>Array(4).fill(0));spawn2048();spawn2048();draw2048()}
function spawn2048(){let e=[];g2048.forEach((r,y)=>r.forEach((v,x)=>{if(!v)e.push([y,x])}));if(e.length){let [y,x]=e[Math.floor(Math.random()*e.length)];g2048[y][x]=Math.random()<.9?2:4}}
function draw2048(){$("b2048").innerHTML=g2048.flat().map(v=>`<div class="cell" style="background:${v?'#dce6fa':'#243653'};color:#17233a">${v||""}</div>`).join("")}
function move2048(dir){let old=JSON.stringify(g2048);for(let k=0;k<4;k++){let line=dir==="left"||dir==="right"?g2048[k]:g2048.map(r=>r[k]);if(dir==="right"||dir==="down")line.reverse();line=line.filter(Boolean);for(let i=0;i<line.length-1;i++)if(line[i]===line[i+1]){line[i]*=2;line.splice(i+1,1)}while(line.length<4)line.push(0);if(dir==="right"||dir==="down")line.reverse();if(dir==="left"||dir==="right")g2048[k]=line;else line.forEach((v,i)=>g2048[i][k]=v)}if(old!==JSON.stringify(g2048))spawn2048();draw2048()}
document.addEventListener("keydown",e=>{if(!$("page").classList.contains("hidden")&&$("pageTitle").textContent==="2048"){let m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};if(m[e.key]){e.preventDefault();move2048(m[e.key])}}});
let mine=[],mineOpen=[],mineFlag=[];function initMines(){mine=Array.from({length:64},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,10);mineOpen=[];mineFlag=[];drawMines()}
function drawMines(){$("mineBoard").innerHTML=Array.from({length:64},(_,i)=>`<div class="cell ${mineOpen.includes(i)?"open":mineFlag.includes(i)?"flag":""}" onclick="mineClick(${i})" ondblclick="mineMark(${i})">${mineOpen.includes(i)?(mine.includes(i)?"💣":mine.filter(m=>Math.abs(m%8-i%8)<=1&&Math.abs(Math.floor(m/8)-Math.floor(i/8))<=1).length||"") :mineFlag.includes(i)?"🚩":""}</div>`).join("")}
function mineMark(i){if(mineOpen.includes(i))return;mineFlag.includes(i)?mineFlag=mineFlag.filter(x=>x!==i):mineFlag.push(i);drawMines()}
function mineClick(i){if(mineOpen.includes(i)||mineFlag.includes(i))return;mineOpen.push(i);if(mine.includes(i)){alert("Мина! Начни новую игру.");mineOpen=Array.from({length:64},(_,i)=>i)}drawMines()}
let sud=[1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1],sudGiven=[0,1,4,7,8,11,14,15];function initSudoku(){$("sudokuBoard").innerHTML=sud.map((v,i)=>`<input class="cell" style="width:100%;text-align:center" ${sudGiven.includes(i)?`value="${v}" disabled`:""} id="s${i}" maxlength="1" inputmode="numeric">`).join("")}
function checkSudoku(){let ok=sud.every((v,i)=>Number($("s"+i).value||0)===v);$("sudokuMsg").textContent=ok?"Отлично! Всё правильно 🎉":"Пока есть ошибки или пустые клетки. Попробуй ещё раз."}
let snakeTimer;function startSnake(){clearInterval(snakeTimer);let c=$("snakeCanvas"),ctx=c.getContext("2d"),snake=[{x:8,y:8}],dir={x:1,y:0},food={x:14,y:8};function draw(){ctx.clearRect(0,0,320,320);ctx.fillStyle="#6c8cff";snake.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));ctx.fillStyle="#42c99a";ctx.fillRect(food.x*20,food.y*20,18,18)}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=16||h.y<0||h.y>=16||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(snakeTimer);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y)food={x:Math.floor(Math.random()*16),y:Math.floor(Math.random()*16)};else snake.pop();draw()}draw();snakeTimer=setInterval(tick,150);document.onkeydown=e=>{if(e.key==="ArrowUp"&&dir.y!==1)dir={x:0,y:-1};if(e.key==="ArrowDown"&&dir.y!==-1)dir={x:0,y:1};if(e.key==="ArrowLeft"&&dir.x!==1)dir={x:-1,y:0};if(e.key==="ArrowRight"&&dir.x!==-1)dir={x:1,y:0}};let sx=0,sy=0;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))dir={x:Math.sign(dx),y:0};else dir={x:0,y:Math.sign(dy)}}}
function drawCheckers(){let b=$("checkersBoard");b.innerHTML="";for(let y=0;y<8;y++)for(let x=0;x<8;x++){let d=document.createElement("div");d.className="cell";d.style.background=(x+y)%2?"#243653":"#dce6fa";if((x+y)%2&&y<3)d.textContent="⚫";if((x+y)%2&&y>4)d.textContent="⚪";b.appendChild(d)}}
let match=[],matchPick=null,matchScore=0;function initMatch(){match=Array.from({length:36},()=>["🍒","🍋","🍇","🍊"][Math.floor(Math.random()*4)]);matchScore=0;matchPick=null;drawMatch()}
function drawMatch(){$("matchBoard").innerHTML=match.map((v,i)=>`<div class="cell" onclick="matchTap(${i})">${v}</div>`).join("");$("matchScore").textContent="Очки: "+matchScore}
function matchTap(i){if(matchPick===null){matchPick=i;return}if(Math.abs(matchPick-i)===1||Math.abs(matchPick-i)===6){[match[matchPick],match[i]]=[match[i],match[matchPick]];matchScore+=3}matchPick=null;drawMatch()}
